[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scropipe"
version = "0.1.0"
description = "Audio pipeline orchestrator for Scrumpler and Scronchler"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
scropipe = "scropipe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["scropipe"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.black]
line-length = 100
target-version = ["py311"]
